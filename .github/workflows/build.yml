name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: fallpredict-jar
          path: build/libs/fallpredict-*.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/fallpredict-*.jar | grep -v -e sources -e dev | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Fall Predict (latest build)" --notes "Minecraft 1.21.11, Fabric. Needs Fabric API." --target "$GITHUB_SHA"
